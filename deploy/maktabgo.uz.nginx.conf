# MaktabGo — reverse-proxy на systemd-сервис birga (127.0.0.1:8099).
# Рядом с birga.mehrgo.uz, тот же бэкенд/БД (схема shuttle). Такси не затрагивает.
# 1) положить как /etc/nginx/sites-available/maktabgo.uz (Ubuntu) и symlink в sites-enabled,
#    ЛИБО как /etc/nginx/conf.d/maktabgo.uz.conf
# 2) nginx -t && systemctl reload nginx
# 3) certbot --nginx -d maktabgo.uz -d www.maktabgo.uz   (добавит 443 + редирект автоматически)
server {
    listen 80;
    listen [::]:80;
    server_name maktabgo.uz www.maktabgo.uz;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # на случай будущего ws (сейчас Birga на polling — не мешает):
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_upgrade;
        proxy_read_timeout 75s;
    }
}
