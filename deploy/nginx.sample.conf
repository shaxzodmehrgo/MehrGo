# MaktabGo — пример nginx (рядом с такси, отдельный server_name/порт).
# Схема БД shuttle изолирована; на стабильность такси не влияет.
server {
    listen 80;
    server_name maktabgo.local;               # или поддомен
    root /var/www/projects/maktabgo/web;
    index index.html index.php;

    # Родительский web-app — корень; API — /api/*
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # свой сокет php-fpm
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DB_HOST 127.0.0.1;
        fastcgi_param DB_NAME maktabgo_dev;
        fastcgi_param DB_USER postgres;
        fastcgi_param DB_PASS "";
        fastcgi_param ROUTE_PROVIDER yandex;
        fastcgi_param YANDEX_MAP_API_KEY "ВАШ_КЛЮЧ";
    }
}
